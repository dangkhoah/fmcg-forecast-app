name: FMCG Forecast App CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend & Model Service dependencies
        run: |
          # Install dependencies globally on the runner system using uv
          cd backend
          uv pip install -r requirements-dev.txt --system
          cd ../model-service
          uv pip install -r requirements-dev.txt --system

      - name: Run Tests
        run: |
          # Run tests with PYTHONPATH set to the backend and model-service directories
          PYTHONPATH=backend:model-service pytest tests/
